version: '3.8'

# Local/self-hosted stack. SESSION_SECRET and ADMIN_SECRET_KEY have no safe
# defaults — compose refuses to start without them:
#   SESSION_SECRET=$(openssl rand -hex 32) ADMIN_SECRET_KEY=$(openssl rand -hex 24) docker-compose up -d --build
services:
  # 1. ShowItGlo Next.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://showitglo:${POSTGRES_PASSWORD:-showitglo_local_dev}@postgres:5432/showitglo?sslmode=disable
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required (openssl rand -hex 32)}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:?ADMIN_SECRET_KEY is required (openssl rand -hex 24)}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

  # 2. PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: showitglo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-showitglo_local_dev}
      POSTGRES_DB: showitglo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showitglo -d showitglo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
